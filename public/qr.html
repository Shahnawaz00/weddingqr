<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0a08" />
  <title>Scan to share</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Caveat:wght@400;500;600&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fraunces:ital,opsz,SOFT,wght@0,9..144,0..100,400;0,9..144,0..100,500;0,9..144,0..100,600;1,9..144,0..100,400&family=JetBrains+Mono:wght@400;500&family=Reem+Kufi:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Caveat:wght@400;500;600&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fraunces:ital,opsz,SOFT,wght@0,9..144,0..100,400;0,9..144,0..100,500;0,9..144,0..100,600;1,9..144,0..100,400&family=JetBrains+Mono:wght@400;500&family=Reem+Kufi:wght@400;500;600;700&display=swap" /></noscript>

  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; font-family: 'Cormorant Garamond', 'Times New Roman', serif; }
    body { background: #0c0a08; color: #e8dfc8; }
    html[data-universe="manuscript"] body { background: #f8f4ea; color: #0e1a13; }
    html[data-universe="garden"]     body { background: #faf4ea; color: #6b3a32; }
  </style>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var urlU = params.get('theme') || params.get('universe');
      var stored = localStorage.getItem('izzywedding-universe');
      var AVAIL = ['cinema', 'manuscript', 'garden'];
      var name = (urlU && AVAIL.indexOf(urlU) >= 0) ? urlU
               : (stored && AVAIL.indexOf(stored) >= 0) ? stored
               : 'cinema';
      document.documentElement.setAttribute('data-universe', name);
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.id = 'universe';
      link.href = '/themes/' + name + '.css';
      document.head.appendChild(link);
    })();
  </script>

  <script src="/config.js"></script>
  <script src="/hijri.js"></script>
  <script src="/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@04f46c6/qrcode.min.js"></script>
</head>
<body>
  <div class="lb-bar top no-print" aria-hidden="true"></div>
  <div class="lb-bar bottom no-print" aria-hidden="true"></div>

  <div class="container">
    <div class="qr-stage fade">
      <div class="qr-card">
        <span class="cropmark tl" aria-hidden="true"></span>
        <span class="cropmark tr" aria-hidden="true"></span>
        <span class="cropmark bl" aria-hidden="true"></span>
        <span class="cropmark br" aria-hidden="true"></span>

        <p class="bismillah" lang="ar" dir="rtl">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>

        <h2><span id="brideName">—</span><span class="ampersand">&amp;</span><span id="groomName">—</span></h2>

        <p class="scan-prompt" id="prompt">Scan to share your moments</p>

        <div class="qr-frame" id="qrcode" aria-label="QR code"></div>

        <p class="visit-label">or visit</p>
        <p class="visit-url" id="qrUrl"></p>

        <p class="stamp" id="stamp">—</p>
        <p class="stamp-hijri" id="stampHijri"></p>
      </div>
    </div>

    <div class="btn-row no-print">
      <button class="btn btn-primary" onclick="window.print()">Print this card</button>
      <a class="link-elegant" href="/">Back home</a>
    </div>
  </div>

  <script>
    const c = window.WEDDING_CONFIG || {};
    document.getElementById('brideName').textContent = c.brideName || '';
    document.getElementById('groomName').textContent = c.groomName || '';
    document.getElementById('prompt').textContent = c.uploadPrompt || 'Scan to share your moments';
    document.title = `Scan to share — ${c.brideName} & ${c.groomName}`;

    const dateStr = formatDate(c.date);
    const venue   = (c.venue || '').toUpperCase();
    document.getElementById('stamp').textContent = [dateStr, venue].filter(Boolean).join('  ·  ');

    const hijriEl = document.getElementById('stampHijri');
    if (c.hijriDate) hijriEl.textContent = c.hijriDate.toUpperCase();
    else if (c.date && window.Hijri) hijriEl.textContent = window.Hijri.formatHijri(new Date(c.date));
    else hijriEl.style.display = 'none';

    const uploadUrl = `${window.location.origin}/upload.html`;
    document.getElementById('qrUrl').textContent = uploadUrl;

    // QR colour follows the active universe's primary ink (cinema=#0c0a08)
    const themeDark = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#0c0a08';

    new QRCode(document.getElementById('qrcode'), {
      text: uploadUrl,
      width: 240, height: 240,
      colorDark: themeDark, colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get('per') === '2') {
      document.body.classList.add('print-2up');
      const card = document.querySelector('.qr-card');
      const clone = card.cloneNode(true);
      const cloneQrEl = clone.querySelector('#qrcode');
      cloneQrEl.id = 'qrcode-clone';
      cloneQrEl.innerHTML = '';
      card.parentNode.appendChild(clone);
      new QRCode(cloneQrEl, {
        text: uploadUrl,
        width: 240, height: 240,
        colorDark: themeDark, colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
    }

    function formatDate(s) {
      if (!s) return '';
      const d = new Date(s);
      if (isNaN(d.getTime())) return '';
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yy = String(d.getFullYear()).slice(-2);
      return `${dd} · ${mm} · ${yy}`;
    }
  </script>
</body>
</html>
