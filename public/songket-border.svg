<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 14" preserveAspectRatio="xMidYMid meet">
  <!-- Pucuk rebung — Malay songket "bamboo shoot" border motif.
       Repeating triangular peaks with smaller inner triangles,
       anchored to a hairline base. Reproduced inline as a CSS
       data-URI for the page top/bottom borders; this file is the
       canonical reference. -->
  <g fill="none" stroke="#b08948" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 12 L 6 2 L 12 12 M 12 12 L 18 2 L 24 12 M 24 12 L 30 2 L 36 12 M 36 12 L 42 2 L 48 12 M 48 12 L 54 2 L 60 12"/>
    <path d="M3 12 L 6 6 L 9 12 M 15 12 L 18 6 L 21 12 M 27 12 L 30 6 L 33 12 M 39 12 L 42 6 L 45 12 M 51 12 L 54 6 L 57 12"
          opacity="0.55"/>
    <line x1="0" y1="12" x2="60" y2="12" opacity="0.7"/>
  </g>
</svg>
