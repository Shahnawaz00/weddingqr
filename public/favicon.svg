<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0e3b2a"/>
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#b08948" stroke-width="0.5"/>
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#e2d3b3" stroke-width="0.4"/>

  <!-- I (thicker variant for 32px clarity) -->
  <g fill="#d4af6b">
    <rect x="8.4" y="11" width="1.4" height="10"/>            <!-- stem -->
    <rect x="6.4" y="10.6" width="5.4" height="0.7"/>         <!-- top serif -->
    <rect x="6.4" y="20.7" width="5.4" height="0.7"/>         <!-- bottom serif -->
  </g>

  <!-- 8-point star -->
  <g fill="#d4af6b">
    <rect x="15.3" y="14" width="1.4" height="4"/>
    <rect x="15.3" y="14" width="1.4" height="4" transform="rotate(45 16 16)"/>
  </g>

  <!-- A (thicker variant for clarity) -->
  <g fill="#d4af6b">
    <polygon points="22.4,11 22.9,11 21,21 20.1,21"/>          <!-- left thin -->
    <polygon points="22.4,11 22.9,11 25.2,21 23.9,21"/>        <!-- right thicker -->
    <rect x="20.7" y="17.4" width="3.7" height="0.7"/>         <!-- crossbar -->
  </g>
</svg>
