<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a08" />
  <title>Wedding</title>
  <meta name="description" content="A celebration. Share your moments with us." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- All universe fonts in a single non-blocking preconnect + stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Google Fonts loaded NON-blocking (media=print swaps to all on
       load) so the body paints in system fonts immediately and swaps
       to the web faces when ready. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Caveat:wght@400;500;600&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fraunces:ital,opsz,SOFT,wght@0,9..144,0..100,400;0,9..144,0..100,500;0,9..144,0..100,600;1,9..144,0..100,400&family=JetBrains+Mono:wght@400;500&family=Reem+Kufi:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Caveat:wght@400;500;600&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fraunces:ital,opsz,SOFT,wght@0,9..144,0..100,400;0,9..144,0..100,500;0,9..144,0..100,600;1,9..144,0..100,400&family=JetBrains+Mono:wght@400;500&family=Reem+Kufi:wght@400;500;600;700&display=swap" /></noscript>

  <!-- Critical anti-FOUC: paint correct background + acceptable
       fallback typography at first paint. -->
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; font-family: 'Cormorant Garamond', 'Times New Roman', serif; }
    body { background: #0c0a08; color: #e8dfc8; }
    html[data-universe="manuscript"] body { background: #f8f4ea; color: #0e1a13; }
    html[data-universe="garden"]     body { background: #faf4ea; color: #6b3a32; }
  </style>

  <!-- Synchronous universe selection — runs before any subsequent
       resource starts loading, so we never load and discard the wrong
       universe stylesheet. -->
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var urlU = params.get('theme') || params.get('universe');
      var stored = localStorage.getItem('izzywedding-universe');
      var AVAIL = ['cinema', 'manuscript', 'garden'];
      var name = (urlU && AVAIL.indexOf(urlU) >= 0) ? urlU
               : (stored && AVAIL.indexOf(stored) >= 0) ? stored
               : 'cinema';
      document.documentElement.setAttribute('data-universe', name);
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.id = 'universe';
      link.href = '/themes/' + name + '.css';
      document.head.appendChild(link);
    })();
  </script>

  <script src="/config.js"></script>
  <script src="/hijri.js"></script>
  <script src="/theme.js"></script>
</head>
<body>
  <div class="lb-bar top" aria-hidden="true"></div>
  <div class="lb-bar bottom" aria-hidden="true"></div>

  <div class="container">
    <span class="bismillah-star" aria-hidden="true"></span>
    <p class="bismillah" lang="ar" dir="rtl">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
    <p class="bismillah-translit">In the name of God, the Most Gracious, the Most Merciful</p>

    <div class="hero">
      <p class="eyebrow-label fade">The Wedding Of</p>
      <h1>
        <span class="name" id="brideName">—</span>
        <span class="ampersand">&amp;</span>
        <span class="name" id="groomName">—</span>
      </h1>
      <p class="blessing rise rise-4" lang="ar" dir="rtl">بَارَكَ ٱللَّٰهُ لَكُمَا وَبَارَكَ عَلَيْكُمَا</p>
      <p class="meta-combined rise rise-5">
        <span id="weddingDate">—</span><span class="sep" id="venueSep">—</span><span class="venue" id="weddingVenue">—</span>
      </p>
      <p class="meta-hijri rise rise-5" id="hijriLine"></p>
      <p class="tagline rise rise-6" id="tagline">—</p>
      <div class="btn-row rise rise-6">
        <a class="btn btn-primary" href="/upload.html">Add a moment</a>
        <a class="link-elegant" href="/gallery.html">View the gallery</a>
      </div>
    </div>

    <div class="foot fade-late">
      <img class="seal" src="/monogram.svg" alt="Izzy and Adam monogram" />
      <p class="hashtag" id="hashtag"></p>
      <a class="meta-link" href="/qr.html">Print QR card</a>

      <div class="theme-picker no-print" aria-label="Universe">
        <p class="theme-picker-label">Universe</p>
        <div class="theme-swatches">
          <button class="theme-swatch" data-theme="cinema"     aria-label="Cinema"     type="button"><span class="swatch-inner" style="--a:#0c0a08;--b:#c25a2a"></span></button>
          <button class="theme-swatch" data-theme="manuscript" aria-label="Manuscript" type="button"><span class="swatch-inner" style="--a:#f3ead0;--b:#14336e"></span></button>
          <button class="theme-swatch" data-theme="garden"     aria-label="Garden"     type="button"><span class="swatch-inner" style="--a:#faf4ea;--b:#7a8b6e"></span></button>
        </div>
        <p class="theme-picker-name" id="themeName">Cinema</p>
      </div>
    </div>
  </div>

  <script>
    const c = window.WEDDING_CONFIG || {};
    document.title = `${c.brideName} & ${c.groomName} — Wedding`;
    document.getElementById('brideName').textContent = c.brideName || '';
    document.getElementById('groomName').textContent = c.groomName || '';

    const dateText = formatDate(c.date) || c.date || '';
    const venueText = (c.venue || '').toUpperCase();
    document.getElementById('weddingDate').textContent = dateText;
    document.getElementById('weddingVenue').textContent = venueText;
    const sep = document.getElementById('venueSep');
    if (dateText && venueText) sep.textContent = '·';
    else sep.style.display = 'none';
    document.getElementById('tagline').textContent = c.tagline || '';
    document.getElementById('hashtag').textContent = c.hashtag || '';

    const hijriEl = document.getElementById('hijriLine');
    if (c.hijriDate) hijriEl.textContent = c.hijriDate.toUpperCase();
    else if (c.date && window.Hijri) hijriEl.textContent = window.Hijri.formatHijri(new Date(c.date));
    else hijriEl.style.display = 'none';

    function formatDate(s) {
      if (!s) return '';
      const d = new Date(s);
      if (isNaN(d.getTime())) return '';
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yy = String(d.getFullYear()).slice(-2);
      return `${dd} · ${mm} · ${yy}`;
    }
  </script>
</body>
</html>
