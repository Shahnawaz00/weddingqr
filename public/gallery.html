<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f9ede1" />
  <title>Gallery</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Caveat:wght@400;500;600&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fraunces:ital,opsz,SOFT,wght@0,9..144,0..100,400;0,9..144,0..100,500;0,9..144,0..100,600;1,9..144,0..100,400&family=JetBrains+Mono:wght@400;500&family=Reem+Kufi:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Caveat:wght@400;500;600&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fraunces:ital,opsz,SOFT,wght@0,9..144,0..100,400;0,9..144,0..100,500;0,9..144,0..100,600;1,9..144,0..100,400&family=JetBrains+Mono:wght@400;500&family=Reem+Kufi:wght@400;500;600;700&display=swap" /></noscript>

  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; font-family: 'Cormorant Garamond', 'Times New Roman', serif; }
    body { background: #f3e3ce; color: #3a2210; }
    html[data-universe="manuscript"] body { background: #f9ede1; color: #471e09; }
    html[data-universe="garden"]     body { background: #f8ecdc; color: #5a2e18; }
  </style>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var urlU = params.get('theme') || params.get('universe');
      var AVAIL = ['cinema', 'manuscript', 'garden'];
      // FINALIZED to Manuscript. A theme saved during earlier switching is
      // intentionally ignored so the locked theme always loads; only an
      // explicit ?theme= override (for dev) can change it.
      var name = (urlU && AVAIL.indexOf(urlU) >= 0) ? urlU : 'manuscript';
      document.documentElement.setAttribute('data-universe', name);
      // Restore a saved custom palette before the theme CSS link is
      // written, so the very first styled paint uses the guest's colours.
      var bp = localStorage.getItem('izzywedding-primary');
      var bs = localStorage.getItem('izzywedding-secondary');
      if (bp) document.documentElement.style.setProperty('--brand-primary', bp);
      if (bs) document.documentElement.style.setProperty('--brand-secondary', bs);
      document.write('<link rel="stylesheet" id="universe" href="/themes/' + name + '.css?v=3">');
    })();
  </script>

  <script src="/config.js"></script>
  <script src="/theme.js"></script>
</head>
<body>
  <div class="lb-bar top" aria-hidden="true"></div>
  <div class="lb-bar bottom" aria-hidden="true"></div>

  <div class="container">
    <div class="hero" style="padding-bottom: 0;">
      <h1 class="compact">
        <span class="name" id="brideTop">—</span><span class="ampersand">&amp;</span><span class="name" id="groomTop">—</span>
      </h1>
    </div>

    <p class="eyebrow">A collection of your moments</p>

    <div class="gallery-filters" id="filters"></div>
    <div class="gallery" id="gallery">
      <span class="skeleton" aria-hidden="true"></span>
      <span class="skeleton" aria-hidden="true"></span>
      <span class="skeleton" aria-hidden="true"></span>
      <span class="skeleton" aria-hidden="true"></span>
      <span class="skeleton" aria-hidden="true"></span>
      <span class="skeleton" aria-hidden="true"></span>
    </div>

    <div class="btn-row">
      <a class="btn btn-primary" href="/upload.html">Upload</a>
      <a class="link-elegant" href="/">Home</a>
    </div>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" id="lbClose" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="lb-stage"><div id="lbContent"></div></div>
    <div class="lb-controls">
      <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="lb-counter" id="lbCounter"></div>
      <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const c = window.WEDDING_CONFIG || {};
    document.getElementById('brideTop').textContent = c.brideName || '';
    document.getElementById('groomTop').textContent = c.groomName || '';
    document.title = `Gallery — ${c.brideName} & ${c.groomName}`;

    const gallery = document.getElementById('gallery');
    const filtersEl = document.getElementById('filters');
    const lightbox = document.getElementById('lightbox');
    const lbContent = document.getElementById('lbContent');
    const lbClose = document.getElementById('lbClose');
    const lbPrev = document.getElementById('lbPrev');
    const lbNext = document.getElementById('lbNext');
    const lbCounter = document.getElementById('lbCounter');
    const events = Array.isArray(c.events) ? c.events : [];
    let allPhotos = [];
    let active = 'all';
    let currentPhotoIndex = -1;
    let touchStartX = 0;

    function getVisiblePhotos() {
      return active === 'all' ? allPhotos : allPhotos.filter((p) => p.event === active);
    }
    function updateLightbox() {
      const visible = getVisiblePhotos();
      if (currentPhotoIndex < 0 || currentPhotoIndex >= visible.length) return;
      const photo = visible[currentPhotoIndex];
      lbContent.innerHTML = '';
      const el = photo.isVideo
        ? Object.assign(document.createElement('video'), { src: photo.url, controls: true, autoplay: true, playsInline: true })
        : Object.assign(document.createElement('img'), { src: photo.url, alt: '' });
      lbContent.appendChild(el);
      lbCounter.textContent = `${currentPhotoIndex + 1} / ${visible.length}`;
      lbPrev.disabled = currentPhotoIndex === 0;
      lbNext.disabled = currentPhotoIndex === visible.length - 1;
    }
    function openLightbox(photo) {
      const visible = getVisiblePhotos();
      currentPhotoIndex = visible.findIndex((p) => p.url === photo.url);
      if (currentPhotoIndex < 0) return;
      updateLightbox();
      lightbox.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lightbox.classList.remove('is-open');
      document.body.style.overflow = '';
      currentPhotoIndex = -1;
      // Clear after the fade-out so the photo doesn't vanish mid-transition.
      setTimeout(() => { if (!lightbox.classList.contains('is-open')) { lbContent.innerHTML = ''; lbCounter.textContent = ''; } }, 380);
    }
    function navPhoto(delta) {
      const visible = getVisiblePhotos();
      currentPhotoIndex = Math.max(0, Math.min(visible.length - 1, currentPhotoIndex + delta));
      updateLightbox();
    }
    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', () => navPhoto(-1));
    lbNext.addEventListener('click', () => navPhoto(1));
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('is-open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navPhoto(-1);
      if (e.key === 'ArrowRight') navPhoto(1);
    });
    lightbox.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
    lightbox.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      if (touchStartX - touchEndX > 50) navPhoto(1);
      if (touchEndX - touchStartX > 50) navPhoto(-1);
    });

    function render() {
      gallery.innerHTML = '';
      const visible = active === 'all' ? allPhotos : allPhotos.filter((p) => p.event === active);
      if (visible.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = active === 'all'
          ? 'No moments yet — be the first to share.'
          : 'No moments in this album yet.';
        gallery.appendChild(empty);
        return;
      }
      visible.forEach((p) => {
        const a = document.createElement('a');
        a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
        a.addEventListener('click', (e) => { e.preventDefault(); openLightbox(p); });
        if (p.isVideo) {
          const v = document.createElement('video');
          v.src = p.url; v.muted = true; v.playsInline = true; v.preload = 'metadata';
          a.appendChild(v);
        } else {
          const img = document.createElement('img');
          img.src = p.url; img.loading = 'lazy'; img.alt = '';
          a.appendChild(img);
        }
        gallery.appendChild(a);
      });
    }

    function buildFilters() {
      filtersEl.innerHTML = '';
      const counts = { all: allPhotos.length };
      allPhotos.forEach((p) => { counts[p.event] = (counts[p.event] || 0) + 1; });
      const mkChip = (slug, label) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = slug === active ? 'is-active' : '';
        btn.innerHTML = `${label} <span class="count">${counts[slug] || 0}</span>`;
        btn.addEventListener('click', () => { active = slug; buildFilters(); render(); });
        return btn;
      };
      filtersEl.appendChild(mkChip('all', 'All'));
      const seen = new Set(['all']);   // the "All" chip above is the only one
      events.forEach((ev) => {
        if (seen.has(ev.slug)) return;  // skip a config "all" so it isn't duplicated
        seen.add(ev.slug);
        filtersEl.appendChild(mkChip(ev.slug, ev.label));
      });
      Object.keys(counts).forEach((slug) => {
        if (slug === 'all' || seen.has(slug)) return;
        filtersEl.appendChild(mkChip(slug, slug));
      });
    }

    fetch('/api/photos')
      .then((r) => r.json())
      .then((data) => { allPhotos = (data.ok && data.photos) || []; buildFilters(); render(); })
      .catch(() => {
        gallery.innerHTML = '';
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Could not load gallery.';
        gallery.appendChild(empty);
      });
  </script>
</body>
</html>
