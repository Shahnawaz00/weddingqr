<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f9ede1" />
  <title>Upload</title>
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Caveat:wght@400;500;600&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fraunces:ital,opsz,SOFT,wght@0,9..144,0..100,400;0,9..144,0..100,500;0,9..144,0..100,600;1,9..144,0..100,400&family=JetBrains+Mono:wght@400;500&family=Reem+Kufi:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Caveat:wght@400;500;600&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fraunces:ital,opsz,SOFT,wght@0,9..144,0..100,400;0,9..144,0..100,500;0,9..144,0..100,600;1,9..144,0..100,400&family=JetBrains+Mono:wght@400;500&family=Reem+Kufi:wght@400;500;600;700&display=swap" /></noscript>

  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; font-family: 'Cormorant Garamond', 'Times New Roman', serif; }
    body { background: #f3e3ce; color: #3a2210; }
    html[data-universe="manuscript"] body { background: #f9ede1; color: #471e09; }
    html[data-universe="garden"]     body { background: #f8ecdc; color: #5a2e18; }
  </style>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var urlU = params.get('theme') || params.get('universe');
      var AVAIL = ['cinema', 'manuscript', 'garden'];
      // FINALIZED to Manuscript. A theme saved during earlier switching is
      // intentionally ignored so the locked theme always loads; only an
      // explicit ?theme= override (for dev) can change it.
      var name = (urlU && AVAIL.indexOf(urlU) >= 0) ? urlU : 'manuscript';
      document.documentElement.setAttribute('data-universe', name);
      // Restore a saved custom palette before the theme CSS link is
      // written, so the very first styled paint uses the guest's colours.
      var bp = localStorage.getItem('izzywedding-primary');
      var bs = localStorage.getItem('izzywedding-secondary');
      if (bp) document.documentElement.style.setProperty('--brand-primary', bp);
      if (bs) document.documentElement.style.setProperty('--brand-secondary', bs);
      document.write('<link rel="stylesheet" id="universe" href="/themes/' + name + '.css?v=3">');
    })();
  </script>

  <script src="/config.js"></script>
  <script src="/theme.js"></script>
</head>
<body>
  <div class="lb-bar top" aria-hidden="true"></div>
  <div class="lb-bar bottom" aria-hidden="true"></div>

  <div class="container has-sticky">
    <div class="hero" style="padding-bottom: 0;">
      <h1 class="compact">
        <span class="name" id="brideTop">—</span><span class="ampersand">&amp;</span><span class="name" id="groomTop">—</span>
      </h1>
    </div>

    <p class="italic-prompt" id="prompt">—</p>

    <div class="card" id="uploadCard">
      <label class="dropzone" id="dropzone" for="fileInput">
        <img class="dz-art" src="/dropzone-art.svg" alt="" aria-hidden="true" />
        <p class="dz-title">Add to the album</p>
        <p class="dz-sub dz-sub-touch">a photo, a video, a blurry one — all welcome</p>
        <p class="dz-sub dz-sub-pointer">a photo, a video, a blurry one — all welcome · or drag &amp; drop here</p>
        <input id="fileInput" type="file" accept="image/*,video/*" multiple />
      </label>

      <div class="field" id="eventField" style="display:none;">
        <label>Which event?</label>
        <div class="event-picker" id="eventPicker"></div>
      </div>

      <div class="field" id="senderField">
        <label for="sender">Your name (optional)</label>
        <input id="sender" type="text" maxlength="24" autocomplete="name" placeholder="e.g. Aunty Sara" />
      </div>

      <div id="fileList" aria-live="polite"></div>

      <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
      <p id="status" role="status"></p>

      <div class="btn-row desktop-only-cta">
        <button class="btn btn-primary" id="uploadBtnDesktop" disabled>Upload</button>
        <a class="link-elegant" href="/gallery.html">View the gallery</a>
      </div>

      <div class="btn-row" id="retryRow" style="display:none;">
        <button class="btn btn-primary" id="retryBtn" type="button">Try again</button>
      </div>
    </div>

    <div class="ceremony" id="ceremony" aria-live="polite">
      <span class="bismillah-star" aria-hidden="true"></span>
      <p class="ceremony-msg" id="ceremonyMsg">Uploaded — thank you!</p>
      <div class="btn-row ceremony-sub">
        <a class="btn btn-primary" href="/gallery.html">View gallery</a>
        <button class="link-elegant" type="button" id="addMoreBtn">Upload more</button>
      </div>
    </div>

    <div style="text-align:center;">
      <a class="back-link" href="/">Back home</a>
    </div>
  </div>

  <div class="sticky-cta" id="stickyCta">
    <button class="btn btn-primary" id="uploadBtn" disabled>Upload</button>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo preview">
    <button class="lb-close" id="lbClose" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="lb-stage"><div id="lbContent"></div></div>
    <div class="lb-controls">
      <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="lb-counter" id="lbCounter"></div>
      <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const c = window.WEDDING_CONFIG || {};
    document.getElementById('brideTop').textContent = c.brideName || '';
    document.getElementById('groomTop').textContent = c.groomName || '';
    document.getElementById('prompt').textContent = c.uploadPrompt || '';
    document.title = `Upload — ${c.brideName} & ${c.groomName}`;

    const events = Array.isArray(c.events) ? c.events : [];
    if (events.length > 0) {
      const picker = document.getElementById('eventPicker');
      const field = document.getElementById('eventField');
      events.forEach((ev, i) => {
        const id = `evt_${ev.slug}`;
        const input = document.createElement('input');
        input.type = 'radio'; input.name = 'event'; input.id = id; input.value = ev.slug;
        if (i === 0) input.checked = true;
        const label = document.createElement('label');
        label.htmlFor = id;
        label.appendChild(document.createTextNode(ev.label));
        picker.appendChild(input);
        picker.appendChild(label);
      });
      field.style.display = '';
    }
    function getSelectedEvent() {
      const checked = document.querySelector('input[name="event"]:checked');
      return checked ? checked.value : 'lain-lain';
    }

    const dropzone   = document.getElementById('dropzone');
    const fileInput  = document.getElementById('fileInput');
    const fileList   = document.getElementById('fileList');
    const uploadBtn  = document.getElementById('uploadBtn');
    const uploadBtnD = document.getElementById('uploadBtnDesktop');
    const senderEl   = document.getElementById('sender');
    const statusEl   = document.getElementById('status');
    const progress   = document.getElementById('progress');
    const progressBar= document.getElementById('progressBar');
    const stickyCta  = document.getElementById('stickyCta');
    const uploadCard = document.getElementById('uploadCard');
    const ceremony   = document.getElementById('ceremony');
    const retryRow   = document.getElementById('retryRow');
    const retryBtn   = document.getElementById('retryBtn');
    const addMoreBtn = document.getElementById('addMoreBtn');

    let selected = [];
    let urls = [];   // object URLs, index-aligned with `selected`

    const savedName = localStorage.getItem('izzywedding-sender');
    if (savedName) senderEl.value = savedName;

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg || '';
      statusEl.classList.toggle('error', isError);
    }
    const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

    function refreshUrls() {
      urls.forEach((u) => URL.revokeObjectURL(u));
      urls = selected.map((f) => URL.createObjectURL(f));
    }
    function renderThumbs() {
      refreshUrls();
      fileList.innerHTML = '';
      selected.forEach((file, idx) => {
        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        thumb.setAttribute('role', 'button');
        thumb.setAttribute('aria-label', 'View ' + file.name);
        if (file.type.startsWith('video/')) {
          const v = document.createElement('video');
          v.src = urls[idx]; v.muted = true; v.playsInline = true;
          thumb.appendChild(v);
          const b = document.createElement('span');
          b.className = 'badge'; b.textContent = 'video';
          thumb.appendChild(b);
        } else {
          const img = document.createElement('img');
          img.src = urls[idx]; img.alt = file.name;
          thumb.appendChild(img);
        }
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'thumb-remove';
        rm.setAttribute('aria-label', 'Remove ' + file.name);
        rm.innerHTML = ICON_X;
        rm.addEventListener('click', (e) => { e.stopPropagation(); removeAt(idx); });
        thumb.appendChild(rm);
        thumb.addEventListener('click', () => openPreview(idx));
        fileList.appendChild(thumb);
      });
      if (selected.length > 0 && selected.length < 30) {
        const add = document.createElement('button');
        add.type = 'button';
        add.className = 'thumb thumb-add';
        add.innerHTML = '<span class="plus">+</span><small>Add more</small>';
        add.addEventListener('click', () => fileInput.click());
        fileList.appendChild(add);
      }
      const empty = selected.length === 0;
      uploadBtn.disabled = empty;
      uploadBtnD.disabled = empty;
      stickyCta.classList.toggle('is-visible', !empty);
    }

    function removeAt(idx) {
      selected.splice(idx, 1);
      renderThumbs();
      if (selected.length) {
        setStatus(`${selected.length} ${selected.length === 1 ? 'file' : 'files'} ready to upload.`);
      } else {
        setStatus('');
      }
    }

    function addFiles(files) {
      const arr = Array.from(files).filter((f) =>
        f.type.startsWith('image/') || f.type.startsWith('video/')
      );
      const before = selected.length;
      selected = selected.concat(arr).slice(0, 30);
      renderThumbs();
      const added = selected.length - before;
      if (added) setStatus(`${selected.length} ${selected.length === 1 ? 'file' : 'files'} ready to upload.`);
      retryRow.style.display = 'none';
    }

    fileInput.addEventListener('change', (e) => { addFiles(e.target.files); fileInput.value = ''; });

    // ── Tap-to-preview lightbox (mirrors the gallery viewer) ──────
    const lightbox = document.getElementById('lightbox');
    const lbContent = document.getElementById('lbContent');
    const lbClose = document.getElementById('lbClose');
    const lbPrev = document.getElementById('lbPrev');
    const lbNext = document.getElementById('lbNext');
    const lbCounter = document.getElementById('lbCounter');
    let pvIndex = -1, pvTouchX = 0;

    function updatePreview() {
      if (pvIndex < 0 || pvIndex >= selected.length) return;
      const file = selected[pvIndex];
      lbContent.innerHTML = '';
      const el = file.type.startsWith('video/')
        ? Object.assign(document.createElement('video'), { src: urls[pvIndex], controls: true, autoplay: true, playsInline: true })
        : Object.assign(document.createElement('img'), { src: urls[pvIndex], alt: file.name });
      lbContent.appendChild(el);
      lbCounter.textContent = `${pvIndex + 1} / ${selected.length}`;
      lbPrev.disabled = pvIndex === 0;
      lbNext.disabled = pvIndex === selected.length - 1;
    }
    function openPreview(idx) {
      pvIndex = idx;
      updatePreview();
      lightbox.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }
    function closePreview() {
      lightbox.classList.remove('is-open');
      document.body.style.overflow = '';
      pvIndex = -1;
      setTimeout(() => { if (!lightbox.classList.contains('is-open')) { lbContent.innerHTML = ''; lbCounter.textContent = ''; } }, 380);
    }
    function navPreview(delta) {
      pvIndex = Math.max(0, Math.min(selected.length - 1, pvIndex + delta));
      updatePreview();
    }
    lbClose.addEventListener('click', closePreview);
    lbPrev.addEventListener('click', () => navPreview(-1));
    lbNext.addEventListener('click', () => navPreview(1));
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closePreview(); });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('is-open')) return;
      if (e.key === 'Escape') closePreview();
      if (e.key === 'ArrowLeft') navPreview(-1);
      if (e.key === 'ArrowRight') navPreview(1);
    });
    lightbox.addEventListener('touchstart', (e) => { pvTouchX = e.touches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - pvTouchX;
      if (dx < -50) navPreview(1);
      if (dx > 50) navPreview(-1);
    });
    ;['dragenter', 'dragover'].forEach((evt) => {
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); dropzone.classList.add('is-dragover'); });
    });
    ;['dragleave', 'drop'].forEach((evt) => {
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); dropzone.classList.remove('is-dragover'); });
    });
    dropzone.addEventListener('drop', (e) => {
      if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
    });

    function showCeremony(count) {
      const msg = count === 1
        ? 'Uploaded — thank you!'
        : `${count} files uploaded — thank you!`;
      document.getElementById('ceremonyMsg').textContent = msg;
      uploadCard.style.display = 'none';
      stickyCta.classList.remove('is-visible');
      ceremony.classList.add('is-active');
      try { navigator.vibrate && navigator.vibrate([8, 40, 12]); } catch {}
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function resetForAnother() {
      ceremony.classList.remove('is-active');
      uploadCard.style.display = '';
      selected = [];
      renderThumbs();
      setStatus('');
      progress.classList.remove('is-active', 'is-indeterminate');
      progressBar.style.width = '0%';
    }
    addMoreBtn.addEventListener('click', resetForAnother);
    retryBtn.addEventListener('click', () => doUpload());

    function doUpload() {
      if (!selected.length) return;
      retryRow.style.display = 'none';
      uploadBtn.disabled = true;
      uploadBtnD.disabled = true;
      progress.classList.add('is-active');
      progressBar.style.width = '0%';
      setStatus('Uploading…');

      const sender = senderEl.value.trim();
      if (sender) localStorage.setItem('izzywedding-sender', sender);

      const fd = new FormData();
      if (sender) fd.append('sender', sender);
      fd.append('event', getSelectedEvent());
      selected.forEach((f) => fd.append('files', f, f.name));

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          progress.classList.remove('is-indeterminate');
          progressBar.style.width = `${Math.round((e.loaded / e.total) * 100)}%`;
        } else {
          progress.classList.add('is-indeterminate');
        }
      };
      xhr.onload = () => {
        progress.classList.remove('is-active', 'is-indeterminate');
        if (xhr.status >= 200 && xhr.status < 300) {
          let resp = {}; try { resp = JSON.parse(xhr.responseText); } catch {}
          const n = resp.count || selected.length;
          showCeremony(n);
          selected = [];
        } else {
          let msg = 'Upload failed — try again.';
          try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
          setStatus(msg, true);
          retryRow.style.display = '';
          uploadBtn.disabled = false;
          uploadBtnD.disabled = false;
          stickyCta.classList.add('is-visible');
        }
      };
      xhr.onerror = () => {
        progress.classList.remove('is-active', 'is-indeterminate');
        setStatus('Connection dropped — your files are still selected. Try again.', true);
        retryRow.style.display = '';
        uploadBtn.disabled = false;
        uploadBtnD.disabled = false;
        stickyCta.classList.add('is-visible');
      };
      xhr.send(fd);
    }
    uploadBtn.addEventListener('click', doUpload);
    uploadBtnD.addEventListener('click', doUpload);
  </script>
</body>
</html>
