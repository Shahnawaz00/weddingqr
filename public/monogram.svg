<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Izzy and Adam monogram">
  <!-- Double-rule gold ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#b08948" stroke-width="0.6"/>
  <circle cx="50" cy="50" r="42.5" fill="none" stroke="#e2d3b3" stroke-width="0.4"/>

  <!-- "I" — didone with hairline serifs (hand-drawn paths) -->
  <g fill="#b08948">
    <rect x="26.6" y="32" width="2.8" height="36"/>           <!-- stem -->
    <rect x="20" y="31.3" width="16" height="1.1"/>           <!-- top serif -->
    <rect x="20" y="67.6" width="16" height="1.1"/>           <!-- bottom serif -->
    <!-- tiny inner brackets between serif and stem (refines the join) -->
    <path d="M22.5 32.4 Q 24 32.6 26.6 33.6 L 26.6 32.4 Z"/>
    <path d="M33.4 32.4 L 33.4 33.6 Q 32 32.6 29.4 32.4 Z"/>
    <path d="M22.5 67.6 Q 24 67.4 26.6 66.4 L 26.6 67.6 Z"/>
    <path d="M33.4 67.6 L 33.4 66.4 Q 32 67.4 29.4 67.6 Z"/>
  </g>

  <!-- 8-point Rub el Hizb star (centre, slightly brighter gold) -->
  <g fill="#d4af6b">
    <rect x="48.4" y="46" width="3.2" height="8"/>
    <rect x="48.4" y="46" width="3.2" height="8" transform="rotate(45 50 50)"/>
  </g>

  <!-- "A" — didone with thick/thin contrast strokes + thin crossbar -->
  <g fill="#b08948">
    <!-- left stroke (thinner, tapering wider toward base) -->
    <polygon points="70.7,32 71.6,32 64,68 62,68"/>
    <!-- right stroke (thicker, contrast stroke) -->
    <polygon points="70.7,32 71.6,32 80,68 77,68"/>
    <!-- crossbar (hairline) -->
    <rect x="64.6" y="55" width="13" height="1"/>
    <!-- apex tiny serif top -->
    <rect x="69.7" y="31.2" width="3" height="0.9"/>
    <!-- base feet (refined) -->
    <rect x="59.5" y="67.6" width="6" height="1"/>
    <rect x="76" y="67.6" width="6" height="1"/>
  </g>
</svg>
